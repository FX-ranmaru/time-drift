      }
    }
    // Sparkle
    if (Math.random() < 0.06) {
      const a = Math.random() * TAU, sp = rand(0.5, 1.5);
      state.particles.push({
        x: mo.x, y: mo.y, z: mo.z + 8,
        vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, vz: rand(0, 1),
        life: 18, max: 18, color: '#ffd84a', r: 1.5,
      });
    }
  }

  function drawBeams() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const b of state.beams) {
      const a = b.life / b.max;
      const pw = b.power || 1;
      const widen = 1 + (pw - 1) * 0.2;
      const s1 = w2s(b.sx, b.sy, b.sz || 30);
      const s2 = w2s(b.ex, b.ey, b.ez || 30);
      ctx.strokeStyle = `rgba(120, 220, 255, ${0.35 * a})`;
      ctx.lineWidth = 10 * widen; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
      ctx.strokeStyle = `rgba(170, 240, 255, ${0.7 * a})`;
      ctx.lineWidth = 5 * widen;
      ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
      ctx.strokeStyle = `rgba(255, 255, 255, ${0.95 * a})`;
      ctx.lineWidth = 2 * widen;
      ctx.beginPath(); ctx.moveTo(s1.x, s1.y); ctx.lineTo(s2.x, s2.y); ctx.stroke();
      ctx.fillStyle = `rgba(170, 240, 255, ${0.6 * a})`;
      ctx.beginPath(); ctx.arc(s2.x, s2.y, 8 * a * widen, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function drawShockwaves() {
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (const sw of state.shockwaves) {
      const a = sw.life / sw.lifeMax;
      const c = w2s(sw.x, sw.y, 0);
      ctx.strokeStyle = `rgba(170, 240, 255, ${0.7 * a})`;
      ctx.lineWidth = 4 * a + 1;
      ctx.beginPath(); ctx.ellipse(c.x, c.y, sw.r, sw.r * 0.5, 0, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }

  function drawParticles() {
    for (const pa of state.particles) {
      const a = pa.life / pa.max;
      const s = w2s(pa.x, pa.y, pa.z || 0);
      ctx.fillStyle = pa.color;
      ctx.globalAlpha = a;
      ctx.beginPath(); ctx.arc(s.x, s.y, pa.r, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPops() {
    for (const p of state.pops) {
      const u = 1 - p.life / p.max;
      const s = w2s(p.worldX, p.worldY, p.z || 60);
      ctx.save();
      ctx.globalAlpha = Math.min(1, 1 - u * 0.9 + 0.1);
      const size = p.size || 26;
      ctx.font = `bold ${size}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.lineWidth = 4;
      ctx.strokeStyle = p.stroke || '#3a2a00';
      ctx.fillStyle = p.color || '#ffd84a';
      if (p.glow) { ctx.shadowColor = p.color || '#aaf0ff'; ctx.shadowBlur = 14; }
      ctx.strokeText(p.txt, s.x, s.y);
      ctx.fillText(p.txt, s.x, s.y);
      ctx.restore();
    }
  }

  function drawFlying(f) {
    const u = Math.min(1, f.t / f.dur);
    if (f.kind === 'pickup') {
      const p = state.player;
      const tx = p.x, ty = p.y;
      const tz = (p.hasBike ? 38 : 50) + state.stack.length * 8;
      const x = lerp(f.sx, tx, u), y = lerp(f.sy, ty, u);
      const z = lerp(f.sz || 0, tz, u) + Math.sin(u * Math.PI) * 80;
      const s = w2s(x, y, z);
      drawMeat(s.x, s.y, 1 + Math.sin(u * Math.PI) * 0.4, u * Math.PI * 1.2, 0.8);
    } else {
      const x = lerp(f.sx, f.tx, u), y = lerp(f.sy, f.ty, u);
      const z = lerp(f.sz || 0, 50, u) + Math.sin(u * Math.PI) * 80;
      const s = w2s(x, y, z);
      drawMeat(s.x, s.y, 1, u * Math.PI * 2);
    }
  }

  function drawJoystick() {
    if (!input.active) return;
    ctx.save();
    ctx.fillStyle = 'rgba(170, 240, 255, 0.12)';
    ctx.strokeStyle = 'rgba(170, 240, 255, 0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(input.sx, input.sy, 50, 0, TAU); ctx.fill(); ctx.stroke();
    const dx = input.cx - input.sx, dy = input.cy - input.sy;
    const d = Math.hypot(dx, dy);
    const max = 50;
    const f = d > max ? max / d : 1;
    ctx.fillStyle = 'rgba(170, 240, 255, 0.55)';
    ctx.shadowColor = '#88e0ff'; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(input.sx + dx * f, input.sy + dy * f, 22, 0, TAU); ctx.fill();
    ctx.restore();
  }

  // ===========================================================
  // RENDER
  // ===========================================================
  function render() {
    ctx.clearRect(0, 0, CV_W, CV_H);
    let shakeX = 0, shakeY = 0;
    if (state.shake > 0) {
      shakeX = (Math.random() - 0.5) * state.shake * 2;
      shakeY = (Math.random() - 0.5) * state.shake * 2;
    }
    ctx.save();
    ctx.translate(shakeX, shakeY);

    // Floors back-to-front
    const sortedFloors = Object.values(state.floors).slice().sort((a, b) => depth(a.cx, a.cy) - depth(b.cx, b.cy));
    for (const f of sortedFloors) drawFloor(f);

    // Ground-level overlays: panels
    for (const pn of state.panels) drawPanel(pn);
    drawShockwaves();

    // Sortable entities
    const drawables = [];
    drawables.push({ d: depth(state.sellZone.x, state.sellZone.y), draw: drawSellBuilding });
    for (const m of allMeats()) drawables.push({ d: depth(m.x, m.y), draw: () => drawGroundMeat(m) });
    for (const e of allEnemies()) drawables.push({ d: depth(e.x, e.y), draw: () => drawMammoth(e) });
    for (const h of state.hunters) drawables.push({ d: depth(h.x, h.y), draw: () => drawHunterNPC(h) });
    for (const c of state.collectors) drawables.push({ d: depth(c.x, c.y), draw: () => drawCollectorNPC(c) });
    for (const mo of state.moneyOrbs) drawables.push({ d: depth(mo.x, mo.y) - 1, draw: () => drawMoneyOrb(mo) });
    for (const d of state.drones) drawables.push({ d: depth(d.x, d.y) + 5, draw: () => drawDrone(d) });
    drawables.push({ d: depth(state.player.x, state.player.y), draw: drawPlayer });
    drawables.sort((a, b) => a.d - b.d);
    for (const d of drawables) d.draw();

    drawBeams();
    for (const f of state.flying) drawFlying(f);
    drawParticles();
    drawPops();
    drawJoystick();

    ctx.restore();
    if (state.hitFlash > 0) {
      ctx.fillStyle = `rgba(170, 240, 255, ${state.hitFlash * 0.3})`;
      ctx.fillRect(0, 0, CV_W, CV_H);
    }
  }

  // ===========================================================
  // MAIN LOOP
  // ===========================================================
  let last = performance.now();
  function tick(now) {
    const raw = (now - last) / (1000 / 60);
    const dt = Math.min(3, raw);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(tick);
  }
  // Seed enemies on origin floor
  for (let i = 0; i < 4; i++) spawnEnemy(state.floors.origin);
  requestAnimationFrame(tick);
})();
</script>
</body>
